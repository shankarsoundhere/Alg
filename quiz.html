
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102b50">
<title>Quiz Master</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6fb;color:#17243a;font-family:Arial,sans-serif}
header{background:linear-gradient(135deg,#102b50,#2465a5);color:white;padding:17px;text-align:center}
header h2{margin:0;font-size:22px}
header p{margin:5px 0 0;font-size:11px;letter-spacing:2px}
.container{max-width:850px;margin:auto;padding:14px}
.card{background:white;border-radius:13px;padding:16px;margin-bottom:14px;box-shadow:0 3px 12px #0000000c}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.timer{font-size:18px;font-weight:bold;color:#d32f2f}
.progress{height:7px;background:#e4eaf2;border-radius:10px;margin-top:13px;overflow:hidden}
.progress div{height:100%;background:#2465a5;width:0}
.question{font-size:19px;line-height:1.6;font-weight:bold;margin:18px 0}
.option{display:block;width:100%;text-align:left;padding:13px;margin:9px 0;border:1px solid #dce3ed;border-radius:9px;background:#fff;font-size:16px;color:#17243a}
.option.selected{border:2px solid #2465a5;background:#edf5ff}
.option.correct{border:2px solid #229954;background:#eaf8ef}
.option.wrong{border:2px solid #e53935;background:#fff0ef}
.option:disabled{opacity:1}
button{border:0;border-radius:8px;padding:11px 16px;font-size:15px;font-weight:bold;cursor:pointer}
.primary{background:#2465a5;color:white}
.secondary{background:#e8eef6;color:#173b64}
.danger{background:#d93636;color:white}
.success{background:#16834a;color:white}
.nav{display:flex;gap:9px;justify-content:space-between;margin-top:16px}
.nav button{flex:1}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}
.palette button{padding:10px 0;background:#e8eef6;color:#173b64}
.palette button.answered{background:#d5ebdc;color:#176b37}
.palette button.review{background:#fff0c2;color:#795600}
.palette button.current{outline:2px solid #2465a5}
.small{font-size:13px;color:#66758a}
.review-btn{margin-top:12px;width:100%}
#quizArea,#resultArea{display:none}
.result-stat{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:#f3f6fb;padding:13px;border-radius:9px;text-align:center}
.stat b{display:block;font-size:23px;margin-bottom:4px}
.filter{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.filter button.active{background:#2465a5;color:white}
.review-item{border-bottom:1px solid #e5eaf1;padding:13px 0;line-height:1.6}
.review-item:last-child{border:0}
#loading{text-align:center;padding:35px}
@media(max-width:420px){
.container{padding:10px}
.question{font-size:17px}
.option{font-size:15px}
.palette{grid-template-columns:repeat(5,1fr)}
}
</style>
</head>
<body>

<header>
<h2>Quiz Master</h2>
<p>LEARN • PRACTICE • ACHIEVE</p>
</header>

<div class="container">
<div id="loading" class="card">क्विज लोड हो रहा है...</div>

<div id="quizArea">
<div class="card">
<div class="top">
<b id="setTitle">Quiz Set</b>
<span class="timer" id="timer">30:00</span>
</div>
<div class="progress"><div id="progressBar"></div></div>
<div class="top small" style="margin-top:9px">
<span id="questionCount">प्रश्न 1</span>
<span id="answeredCount">हल किए: 0</span>
</div>
</div>

<div class="card">
<div class="top">
<span class="small" id="questionNumber">प्रश्न 1</span>
<span class="small" id="reviewStatus"></span>
</div>
<div class="question" id="questionText"></div>
<div id="options"></div>

<button class="secondary review-btn" id="reviewButton" onclick="toggleReview()">★ बाद में देखें</button>

<div class="nav">
<button class="secondary" onclick="previousQuestion()">← पिछला</button>
<button class="primary" onclick="nextQuestion()">अगला →</button>
</div>
</div>

<div class="card">
<b>प्रश्न सूची</b>
<p class="small">हरा = हल किया | पीला = बाद में देखें</p>
<div class="palette" id="palette"></div>
</div>

<div class="card">
<button class="danger" style="width:100%" onclick="confirmSubmit()">क्विज जमा करें</button>
</div>
</div>

<div id="resultArea">
<div class="card">
<button class="success" style="width:100%;margin-bottom:15px" onclick="restartQuiz()">↻ फिर से प्रयास करें</button>
<h2 style="margin:0 0 14px">आपका परिणाम</h2>
<div class="result-stat">
<div class="stat"><b id="score">0</b><span>प्राप्त अंक</span></div>
<div class="stat"><b id="percentage">0%</b><span>प्रतिशत</span></div>
<div class="stat"><b id="correct">0</b><span>सही उत्तर</span></div>
<div class="stat"><b id="wrong">0</b><span>गलत उत्तर</span></div>
<div class="stat"><b id="skipped">0</b><span>छोड़े गए</span></div>
<div class="stat"><b id="total">0</b><span>कुल प्रश्न</span></div>
</div>
<h3 id="performance"></h3>
<button class="secondary" style="width:100%" onclick="location.href=`sets.html?subject=${encodeURIComponent(subject)}&chapter=${chapter}`">सेट सूची पर जाएँ</button>
</div>

<div class="card">
<h3 style="margin-top:0">उत्तर की समीक्षा</h3>
<div class="filter">
<button class="secondary active" onclick="filterReview('all',this)">सभी</button>
<button class="secondary" onclick="filterReview('wrong',this)">गलत</button>
<button class="secondary" onclick="filterReview('correct',this)">सही</button>
<button class="secondary" onclick="filterReview('skipped',this)">छोड़े गए</button>
</div>
<div id="reviewList"></div>
</div>
</div>
</div>

<script>
const params=new URLSearchParams(location.search);
const subject=params.get("subject")||"geography";
const chapter=params.get("chapter")||"1";
const setNumber=parseInt(params.get("set")||"1",10);

let settings={},allQuestions=[],questions=[];
let answers=[],marked=[],current=0;
let duration=30,endTime=0,timerInterval=null;
let finished=false,storageKey="";

const $=id=>document.getElementById(id);

function showError(message){
$("loading").innerHTML="<b style='color:#d32f2f'>क्विज लोड नहीं हो सका!</b><p>"+message+"</p>";
}

async function getJSON(url){
const response=await fetch(url,{cache:"no-store"});
if(!response.ok)throw new Error("फाइल नहीं मिली: "+url);
return await response.json();
}

function validateQuestions(data){
if(!data||!Array.isArray(data.questions)||data.questions.length===0)
throw new Error("प्रश्न JSON में questions की सूची नहीं मिली।");

data.questions.forEach((q,i)=>{
if(!q||typeof q.q!=="string"||!Array.isArray(q.o)||q.o.length!==4||
!q.o.every(x=>typeof x==="string")||
!Number.isInteger(q.a)||q.a<0||q.a>3){
throw new Error("प्रश्न संख्या "+(i+1)+" का फॉर्मेट गलत है।");
}
});
}

function getDuration(data){
const value=Number(data.duration||settings.defaultDuration||30);
return Number.isFinite(value)&&value>0?value:30;
}

async function init(){
try{
if(!Number.isInteger(setNumber)||setNumber<1)throw new Error("Set नंबर गलत है।");

settings=await getJSON("data/settings.json");
const chapterData=await getJSON(`data/${subject.toLowerCase()}/chapter-${chapter}.json`);

validateQuestions(chapterData);
allQuestions=chapterData.questions;

const perSet=Number(settings.questionsPerSet||30);
if(!Number.isInteger(perSet)||perSet<1)throw new Error("settings.json में questionsPerSet गलत है।");

const start=(setNumber-1)*perSet;
questions=allQuestions.slice(start,start+perSet);

if(questions.length===0)throw new Error("इस सेट में कोई प्रश्न उपलब्ध नहीं है।");

duration=getDuration(chapterData);
storageKey=`quiz_${subject}_${chapter}_${setNumber}`;

answers=Array(questions.length).fill(null);
marked=Array(questions.length).fill(false);

loadProgress();

$("loading").style.display="none";
$("quizArea").style.display="block";
$("setTitle").textContent=(chapterData.title||"Chapter")+" - Quiz Set "+setNumber;

if(finished){
showResult();
return;
}

renderQuestion();
renderPalette();
updateCounts();
startTimer();

}catch(error){
showError(error.message||"JSON फाइल पढ़ने में समस्या हुई।");
}
}

function loadProgress(){
try{
const saved=JSON.parse(localStorage.getItem(storageKey)||"null");
if(!saved||saved.questionCount!==questions.length)return;

if(Array.isArray(saved.answers)&&saved.answers.length===questions.length)
answers=saved.answers.map(v=>Number.isInteger(v)&&v>=0&&v<4?v:null);

if(Array.isArray(saved.marked)&&saved.marked.length===questions.length)
marked=saved.marked.map(Boolean);

current=Math.min(Math.max(0,Number(saved.current)||0),questions.length-1);
endTime=Number(saved.endTime)||0;
finished=saved.finished===true;
}catch(e){
localStorage.removeItem(storageKey);
}
}

function saveProgress(){
if(finished)return;
localStorage.setItem(storageKey,JSON.stringify({
questionCount:questions.length,
answers,marked,current,endTime,finished:false
}));
}

function renderQuestion(){
const q=questions[current];
$("questionNumber").textContent="प्रश्न "+(current+1)+" / "+questions.length;
$("questionCount").textContent="प्रश्न "+(current+1)+" / "+questions.length;
$("questionText").textContent=q.q;
$("reviewStatus").textContent=marked[current]?"★ बाद में देखें":"";

$("options").innerHTML="";
q.o.forEach((option,index)=>{
const btn=document.createElement("button");
btn.className="option"+(answers[current]===index?" selected":"");
btn.textContent=String.fromCharCode(65+index)+". "+option;
btn.onclick=()=>selectAnswer(index);
$("options").appendChild(btn);
});

$("reviewButton").textContent=marked[current]?"★ समीक्षा हटाएँ":"★ बाद में देखें";
$("progressBar").style.width=((current+1)/questions.length*100)+"%";

renderPalette();
updateCounts();
}

function selectAnswer(index){
if(finished)return;
answers[current]=index;
saveProgress();
renderQuestion();
}

function previousQuestion(){
if(current>0){current--;saveProgress();renderQuestion();}
}

function nextQuestion(){
if(current<questions.length-1){current++;saveProgress();renderQuestion();}
}

function toggleReview(){
marked[current]=!marked[current];
saveProgress();
renderQuestion();
}

function renderPalette(){
$("palette").innerHTML="";
questions.forEach((q,index)=>{
const btn=document.createElement("button");
btn.textContent=index+1;
if(answers[index]!==null)btn.classList.add("answered");
if(marked[index])btn.classList.add("review");
if(current===index)btn.classList.add("current");
btn.onclick=()=>{current=index;saveProgress();renderQuestion();};
$("palette").appendChild(btn);
});
}

function updateCounts(){
const count=answers.filter(x=>x!==null).length;
$("answeredCount").textContent="हल किए: "+count+" / "+questions.length;
}

function startTimer(){
if(!endTime)endTime=Date.now()+duration*60*1000;
saveProgress();
updateTimer();
timerInterval=setInterval(updateTimer,1000);
}

function updateTimer(){
const remaining=Math.max(0,Math.ceil((endTime-Date.now())/1000));
const min=Math.floor(remaining/60);
const sec=remaining%60;
$("timer").textContent=String(min).padStart(2,"0")+":"+String(sec).padStart(2,"0");

if(remaining<=0){
clearInterval(timerInterval);
finishQuiz();
}
}

function confirmSubmit(){
const unanswered=answers.filter(x=>x===null).length;
if(confirm("क्या आप क्विज जमा करना चाहते हैं?\nबिना उत्तर वाले प्रश्न: "+unanswered)){
finishQuiz();
}
}

function finishQuiz(){
if(finished)return;
finished=true;
clearInterval(timerInterval);
localStorage.setItem(storageKey,JSON.stringify({
questionCount:questions.length,
answers,marked,current,endTime,finished:true
}));
showResult();
}

function showResult(){
finished=true;
clearInterval(timerInterval);
$("quizArea").style.display="none";
$("resultArea").style.display="block";

let correctCount=0,wrongCount=0,skippedCount=0;

questions.forEach((q,i)=>{
if(answers[i]===null)skippedCount++;
else if(answers[i]===q.a)correctCount++;
else wrongCount++;
});

const penalty=Number(settings.negativeMarking||0);
const score=Math.max(0,correctCount-(wrongCount*penalty));
const percent=Math.round((score/questions.length)*100);

$("score").textContent=Number(score.toFixed(2));
$("percentage").textContent=percent+"%";
$("correct").textContent=correctCount;
$("wrong").textContent=wrongCount;
$("skipped").textContent=skippedCount;
$("total").textContent=questions.length;

$("performance").textContent=percent>=80?"बहुत अच्छा! शानदार प्रदर्शन 🎉":
percent>=60?"अच्छा प्रयास! ऐसे ही अभ्यास करते रहें।":
percent>=40?"और अभ्यास की जरूरत है।":
"दोबारा प्रयास करें, आप बेहतर कर सकते हैं।";

filterReview("all");
}

function filterReview(type,button){
document.querySelectorAll(".filter button").forEach(b=>b.classList.remove("active"));
if(button)button.classList.add("active");
else document.querySelector(".filter button").classList.add("active");

$("reviewList").innerHTML="";

questions.forEach((q,i)=>{
const selected=answers[i];
let status=selected===null?"skipped":selected===q.a?"correct":"wrong";
if(type!=="all"&&type!==status)return;

const item=document.createElement("div");
item.className="review-item";

const heading=document.createElement("b");
heading.textContent="प्रश्न "+(i+1)+": "+q.q;
item.appendChild(heading);

q.o.forEach((option,index)=>{
const line=document.createElement("div");
line.style.padding="3px 0";
line.textContent=String.fromCharCode(65+index)+". "+option;

if(index===q.a){
line.style.color="#16834a";
line.style.fontWeight="bold";
}
if(index===selected&&selected!==q.a){
line.style.color="#d93636";
line.style.fontWeight="bold";
}
item.appendChild(line);
});

const result=document.createElement("p");
result.className="small";
result.style.fontWeight="bold";
result.textContent=status==="correct"?"आपका उत्तर सही है":
status==="wrong"?"आपका उत्तर गलत है":
"आपने उत्तर नहीं दिया।";
item.appendChild(result);

$("reviewList").appendChild(item);
});

if(!$("reviewList").children.length)
$("reviewList").textContent="इस श्रेणी में कोई प्रश्न नहीं है।";
}

function restartQuiz(){
if(!confirm("क्या आप इस सेट को बिल्कुल नए सिरे से शुरू करना चाहते हैं?"))return;
clearInterval(timerInterval);
localStorage.removeItem(storageKey);
location.reload();
}

init();
</script>
</body>
</html>
